schema_version: "0.2.0"
task_id: T1
task_version: "0.1.0"
description: >
  T1: Evaluation of Task.

evaluation_scopes:
  - scope_id: backend
    scope_type: subject
    root_path: backend/
    rulepack_id: ts-nestjs-backend
    rulepack_version: "0.1.0"
    enabled:
      constraints:
        - BE-STRUCT-C-001
        - BE-DEP-C-001
        - BE-DEP-C-002
        - BE-DEP-C-003
        - BE-DEP-C-004
        - BE-DOM-C-001
        - BE-DOM-C-002
        - BE-ERR-C-001
        - BE-ERR-C-002
        - BE-ERR-C-003
        - BE-CONTRACT-C-001
        - BE-CONTRACT-C-002
        - BE-TEST-C-001
        - BE-ROUTE-C-001
        - BE-SIZE-C-001
      metrics:
        - BE-STRUCT-M-001
        - BE-DEP-M-001
        - BE-DOM-M-001
        - BE-ERR-M-001
        - BE-CONTRACT-M-001
        - BE-TEST-M-001
        - BE-TEST-M-002
        - BE-ROUTE-M-001
        - BE-SIZE-M-001
      judgments: []
    thresholds:
      BE-DEP-M-001:
        warn_at: 2
        fail_at: 3
    expected_diff_scope: []

  - scope_id: frontend
    scope_type: subject
    root_path: frontend/
    rulepack_id: js-react-frontend
    rulepack_version: "0.1.0"
    enabled:
      constraints:
        - FE-COM-C-001
        - FE-COM-C-002
        - FE-STATE-C-001
        - FE-STATE-C-002
        - FE-ROUTE-C-001
        - FE-ROUTE-C-002
        - FE-STYLE-C-001
        - FE-STYLE-C-002
        - FE-DATA-C-001
        - FE-DATA-C-002
        - FE-COMM-C-001
      metrics:
        - FE-COM-M-001
        - FE-COM-M-002
        - FE-STATE-M-001
        - FE-STATE-M-002
        - FE-ROUTE-M-001
        - FE-ROUTE-M-002
        - FE-STYLE-M-001
        - FE-STYLE-M-002
        - FE-DATA-M-001
        - FE-DATA-M-002
        - FE-COMM-M-001
        - FE-COMM-M-002
      judgments: []
    expected_diff_scope: []

  - scope_id: cross-stack
    scope_type: cross-stack
    root_path: .
    rulepack_id: cross
    rulepack_version: "0.1.0"
    enabled:
      constraints:
        - CROSS-EP-C-001
        - CROSS-METHOD-C-001
        - CROSS-TYPE-C-001
        - CROSS-NAME-C-001
        - CROSS-ERR-C-001
        - CROSS-PROP-C-001
        - CROSS-DUP-C-001
      metrics: []
      judgments: []
    thresholds: {}
    expected_diff_scope: []

judgment_config:
  model: Claude Sonnet 4.6
  temperature: 0.0
  samples_per_rubric: 5
  min_kappa: 0.6

execution:
  fail_fast: false
  max_duration_ms: 600000
  parallel_scopes: false

metadata:
  purpose: T1-evaluation
  notes: >
    This task evaluates the experiment pipeline
