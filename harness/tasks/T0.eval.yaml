schema_version: "0.1.0"
task_id: T0
task_version: "0.1.0"
description: >
  T0: Baseline evaluation of the untouched baseline project.
  Covers backend dependency architecture rules with circular dependency detection.

subjects:
  - subject_id: backend
    root_path: backend/
    rulepack_id: ts-nestjs-backend
    rulepack_version: "0.1.0"
    enabled:
      constraints:
        - BE-STRUCT-C-001
        - BE-STRUCT-C-002
        - BE-DEP-C-001
        - BE-DEP-C-002
        - BE-DEP-C-003
        - BE-DEP-C-004
      metrics:
        - BE-DEP-M-001
      judgments: []
    thresholds:
      BE-DEP-M-001:
        warn_at: 2
        fail_at: 3
    expected_diff_scope: []

  - subject_id: frontend
    root_path: frontend/
    rulepack_id: js-react-frontend
    rulepack_version: "0.1.0"
    enabled:
      constraints:
        - FE-STRUCT-C-001
      metrics: []
      judgments: []
    expected_diff_scope: []

cross_stack:
  rulepack_id: cross
  rulepack_version: "0.1.0"
  enabled:
    constraints: []
    metrics: []
    judgments: []

judgment_config:
  model: claude-sonnet-4-6
  temperature: 0.0
  samples_per_rubric: 5
  min_kappa: 0.6

execution:
  fail_fast: false
  max_duration_ms: 600000
  parallel_subjects: false

metadata:
  purpose: baseline-evaluation-t0
  notes: >
    T0 baseline evaluation with circular dependency detection (BE-DEP-C-004)
    via dependency-cruiser.
