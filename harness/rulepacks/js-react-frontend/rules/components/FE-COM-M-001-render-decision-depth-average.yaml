rule_id: FE-COM-M-001-render-decision-depth-average
version: 0.2.0
layer: metrics
category: component-structure
visibility: agent-visible
severity: warn
adapter: computed-metrics
implementation: FE-COM-M-001

description: >
  Measures the average of each production React component's maximum nested
  render-decision depth. It uses the same per-component decision analysis as
  FE-COM-C-002 and excludes pure structural JSX nesting.

agent_facing_message: >
  Average maximum render-decision depth is {value}. Lower values indicate
  simpler conditional rendering.

research_tags:
  metric_family: render-decision-depth
  erosion_dimension: component-complexity
