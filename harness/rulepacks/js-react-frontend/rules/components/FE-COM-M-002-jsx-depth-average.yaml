rule_id: FE-COM-M-002-jsx-depth-average
version: 0.2.0
layer: metrics
category: component-structure
visibility: agent-visible
severity: warn
adapter: computed-metrics
implementation: frontend-jsx-depth-average

description: >
  Measures the average maximum effective JSX depth across production frontend
  component files using the same fragment, structural-wrapper, render-prop,
  and ignored-file semantics as FE-COM-C-002.

agent_facing_message: >
  Average JSX nesting depth is {value}. Lower values indicate flatter component
  structure.

research_tags:
  metric_family: jsx-depth
  erosion_dimension: component-nesting
