rule_id: FE-COM-C-002-jsx-max-depth
version: 0.1.0
layer: constraints
category: component-structure
visibility: agent-visible
severity: warning

description: >
  JSX nesting should stay within 5 levels to avoid unreadable render trees and
  overly complex component bodies.

