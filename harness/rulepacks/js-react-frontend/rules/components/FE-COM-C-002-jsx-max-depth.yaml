rule_id: FE-COM-C-002-jsx-max-depth
version: 0.3.0
layer: constraints
category: component-structure
visibility: agent-visible
severity: warning

description: >
  Production React render trees must not exceed an effective JSX nesting depth
  of five. Ordinary JSX elements count as one level; fragments and configured
  structural wrappers do not. Render-prop callbacks start independent render
  trees. Each render tree produces at most one finding, and tests, stories, and
  generated files are excluded.

config:
  max_depth: 5
  transparent_wrappers:
    # MUI portal / overlay components
    - Popper
    - Portal
    - Modal
    - Backdrop
    # MUI transition / interaction wrappers
    - ClickAwayListener
    - Fade
    - Grow
    - Zoom
    - Slide
    - Collapse
    # Project-local transparent wrappers
    - Transitions
  transparent_patterns:
    - fragment # <> and <Fragment>
    - render_prop_boundary # callback output starts a separate render tree
  ignored_file_patterns:
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/*.stories.*"
    - "**/__tests__/**"
    - "src/test/**"
    - "**/generated/**"

evidence_sources:
  - adapter: eslint
    tool_rule_ids:
      - architecture/business-jsx-max-depth
    match_condition:
      event_type: file_structure_violation
    aggregation: any

agent_facing_message: >
  {message} Extract a meaningful child component or simplify the render
  structure; adding fragments or configured structural wrappers will not
  reduce the measured depth.

research_tags:
  drift_type: erosion
  severity_class: soft_constraint
  erosion_dimension: component-complexity
  methodological_note: "v0.3.0 — one finding per production render tree; render-prop callbacks are independent boundaries"
