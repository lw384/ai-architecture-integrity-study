rule_id: FE-STATE-C-001-no-local-state-in-stateless-components
version: 0.3.0
layer: constraints
category: state-management
visibility: agent-visible

description: >
  Components inside explicitly configured stateless or presentational
  boundaries must not own local React state through useState or useReducer.
  Interactive components outside those boundaries may keep local UI state.

evidence_sources:
  - adapter: frontend-static
    tool_rule_ids:
      - FE-STATE-C-001
    match_condition:
      event_type: frontend_architecture_violation
    aggregation: any

agent_facing_message: >
  {message}

research_tags:
  drift_type: erosion
  erosion_dimension: state-locality
