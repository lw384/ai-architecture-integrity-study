rule_id: FE-DUP-C-002-single-authoritative-implementation
version: 0.2.0
layer: constraints
category: duplication
visibility: agent-visible

description: >
  Substantive frontend logic has one authoritative implementation. Repeated
  API, form, validation, transformation, state, component, or function logic
  belongs in a shared service, hook, component, or utility. Low-complexity UI
  event-to-state adapters are excluded. One finding is emitted per exact
  implementation file set, with every substantive clone group retained in
  evidence.duplicate_groups.

evidence_sources:
  - adapter: frontend-static
    tool_rule_ids:
      - FE-DUP-C-002
    match_condition:
      event_type: frontend_architecture_violation
    aggregation: any

agent_facing_message: >
  {message}

research_tags:
  drift_type: erosion
  erosion_dimension: authoritative-implementation
