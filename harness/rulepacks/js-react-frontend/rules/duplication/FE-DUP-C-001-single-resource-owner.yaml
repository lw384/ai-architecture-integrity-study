rule_id: FE-DUP-C-001-single-resource-owner
version: 0.1.0
layer: constraints
category: duplication
visibility: agent-visible

description: >
  Each resource has one frontend feature, route, page, and form owner; related
  list, detail, and edit surfaces remain within that owner.

