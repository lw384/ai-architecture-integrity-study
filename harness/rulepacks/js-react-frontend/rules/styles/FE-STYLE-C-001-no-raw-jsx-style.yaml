rule_id: FE-STYLE-C-001-no-raw-jsx-style
version: 0.2.0
layer: constraints
category: styling
visibility: agent-visible
severity: warning

description: >
  React components must not use unmanaged JSX inline styles. Use theme-aware
  sx, styled, MUI theme overrides, CSS Modules backed by theme-exported CSS
  variables, or approved shared abstractions. Inline styles are allowed only
  for runtime CSS custom properties or explicitly documented third-party API
  and dynamic-geometry exceptions.

evidence_sources:
  - adapter: eslint
    tool_rule_ids:
      - "architecture/no-raw-jsx-style"
    match_condition:
      event_type: file_structure_violation
    aggregation: any

agent_facing_message: >
  Unmanaged JSX style props are not allowed. Use the theme-aware styling
  approach, or document a narrowly scoped third-party or dynamic-geometry
  exception.

research_tags:
  drift_type: erosion
  severity_class: soft_constraint
  erosion_dimension: styling-discipline
