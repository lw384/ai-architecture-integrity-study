rule_id: FE-ROUTE-C-002-route-maps-to-page-component
version: 0.1.0
layer: constraints
category: routing
visibility: agent-visible
severity: warning

description: >
  Every route entry must map to a page component. Route loaders or route
  elements should resolve to modules under pages/.

evidence_sources:
  - adapter: eslint
    tool_rule_ids:
      - architecture/route-must-map-to-page-component
    match_condition:
      event_type: file_structure_violation
    aggregation: any

agent_facing_message: >
  Update this route so it maps to a page component. Prefer loader imports from
  pages/* or route elements backed by a pages import.

research_tags:
  drift_type: erosion
  severity_class: soft_constraint
  erosion_dimension: route-to-page-mapping
