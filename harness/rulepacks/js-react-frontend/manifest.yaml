rulepack_id: js-react-frontend
version: 0.4.0
kind: subject
language: [javascript]
frameworks: [react]

adapters:
  frontend-static:
    source: frontend-static
    version: 0.2.0
    config: tool-configs/frontend-static.config.json
    emits: [constraints]
  computed-metrics:
    source: computed-metrics
    version: 0.1.0
    config: tool-configs/metrics.config.json
    emits: [metrics]
    options:
      implementations_root: implementations/frontend

rules:
  constraints:
    - rules/components/FE-COM-C-001-component-file-max-lines.yaml
    - rules/components/FE-COM-C-002-jsx-max-depth.yaml
    - rules/states/FE-STATE-C-001-no-usestate-in-deep-child-components.yaml
    - rules/states/FE-STATE-C-002-context-provider-only-in-controlled-locations.yaml
    - rules/routes/FE-ROUTE-C-001-route-definitions-centralized.yaml
    - rules/routes/FE-ROUTE-C-002-route-maps-to-page-component.yaml
    - rules/styles/FE-STYLE-C-001-no-raw-jsx-style.yaml
    - rules/styles/FE-STYLE-C-002-global-styles-only-in-approved-locations.yaml
    - rules/data/FE-DATA-C-001-network-calls-only-in-approved-modules.yaml
    - rules/data/FE-DATA-C-002-useeffect-requires-dependency-array.yaml
    - rules/communication/FE-COMM-C-001-no-global-event-bus.yaml
    - rules/duplication/FE-DUP-C-001-single-resource-owner.yaml
    - rules/duplication/FE-DUP-C-002-single-authoritative-implementation.yaml
  metrics:
    - rules/components/FE-COM-M-001-jsx-depth-average.yaml
    - rules/states/FE-STATE-M-001-context-provider-ratio.yaml
    - rules/routes/FE-ROUTE-M-001-route-param-complexity.yaml
    - rules/styles/FE-STYLE-M-001-style-mixing-ratio.yaml
    - rules/data/FE-DATA-M-001-data-access-wrapping-ratio.yaml
    - rules/communication/FE-COMM-M-001-prop-drilling-average.yaml
    - rules/duplication/FE-DUP-M-001-clone-ratio.yaml
  judgments: []

metadata:
  migration_status: frontend-constraint-protocol-v2
  notes:
    - All 13 frontend constraints share one production-source evidence inventory.
    - Every registered constraint has positive, negative, near-miss, and ignored fixtures.
    - FE-DUP-C-002 includes semantic duplicates and component/function clones.
    - Frontend metrics run through the shared computed-metrics adapter.
