rule_id: CROSS-EP-C-001-frontend-api-url-resolves-to-backend-route
version: 0.2.0
layer: constraints
category: cross-endpoint-contract
visibility: agent-visible
severity: error

description: >
  Every statically resolvable production frontend API path must match a
  reachable backend public route pattern.

evidence_sources:
  - adapter: cross-static
    tool_rule_ids:
      - "cross-static/frontend-endpoint-missing-backend-route"
    match_condition:
      event_type: cross_contract_violation
    aggregation: any

agent_facing_message: >
  Production frontend API path {frontend_path} in {frontend_file} does not
  match any reachable backend public route pattern.

research_tags:
  drift_type: erosion
  severity_class: hard_constraint
  erosion_dimension: cross-endpoint-alignment
