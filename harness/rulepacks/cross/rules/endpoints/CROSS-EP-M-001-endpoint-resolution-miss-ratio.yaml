rule_id: CROSS-EP-M-001-endpoint-resolution-miss-ratio
version: 0.1.0
layer: metrics
category: cross-endpoint-contract
visibility: agent-visible
severity: warn
adapter: computed-metrics
implementation: CROSS-EP-M-001

description: >
  Continuous view of CROSS-EP-C-001: instead of a binary pass/fail on whether
  any frontend API call fails to resolve to a backend public route, this
  measures what fraction of all statically discovered frontend call sites are
  unresolved. Lets the size of the "broken call" area grow or shrink across
  iterations instead of only reporting whether it is empty.

formula: unresolved_frontend_call_sites / total_frontend_call_sites

agent_facing_message: >
  Endpoint resolution miss ratio is {value}. {unresolvedCallSiteCount} of
  {totalCallSiteCount} frontend API call sites do not resolve to a backend
  public route.

research_tags:
  metric_family: cross-endpoint-contract
  erosion_dimension: cross-endpoint-alignment

methodological_note: >
  Reuses CROSS-EP-C-001's own findings_by_rule output as the numerator and
  cross-static's frontend_endpoint_count execution_meta stat (already produced
  while evaluating the constraint in the same scope run) as the denominator —
  it does not re-scan frontend API call sites. There is no evidence_sources
  block on this rule: core/layers/metrics_runner.mjs never reads that field
  for metric rules — dispatch is driven entirely by the adapter/implementation
  fields above.
