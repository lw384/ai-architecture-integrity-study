rulepack_id: cross
version: 0.1.0
kind: cross-stack
language: [javascript, typescript]
frameworks: [react, nestjs]

adapters:
  cross-static:
    source: cross-static
    version: 0.1.0
    config: tool-configs/cross-static.config.json
    emits: [constraints]
  computed-metrics:
    source: computed-metrics
    version: 0.1.0
    config: tool-configs/metrics.config.json
    emits: [metrics]
    options:
      implementations_root: implementations/cross

rules:
  constraints:
    - rules/endpoints/CROSS-EP-C-001-frontend-api-url-resolves-to-backend-route.yaml
    - rules/types/CROSS-TYPE-C-001-request-query-body-contract-alignment.yaml
    - rules/propagation/CROSS-PROP-C-001-api-facing-change-propagates-to-affected-surfaces.yaml
  metrics:
    - rules/endpoints/CROSS-EP-M-001-endpoint-resolution-miss-ratio.yaml
    - rules/types/CROSS-TYPE-M-001-contract-field-drift-density.yaml
    - rules/propagation/CROSS-PROP-M-001-propagation-incompleteness-ratio.yaml
  judgments: []

metadata:
  migration_status: experimental
  notes:
    - Cross-stack rulepack runs against the workspace root and inspects both frontend and backend subjects.
