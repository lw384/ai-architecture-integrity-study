rule_id: BE-DEP-C-004-no-circular-dependencies
version: 0.2.0
tier: 1
layer: constraints
category: dependency-architecture
visibility: agent-visible

description: >
  Disallow circular dependencies across all modules and layers.
  Circular dependencies create tight coupling, complicate testing, and hinder refactoring.
  Every runtime import edge should contribute to an acyclic dependency graph.
  Type-only edges are excluded because they do not create runtime coupling.
  Detection method: Module A imports B, B imports C, C imports A (or shorter cycles A→B→A)

evidence_sources:
  - adapter: dep-cruiser
    tool_rule_ids:
      - "BE-DEP-C-004-no-circular"
    match_condition:
      event_type: dependency_edge_violation
    aggregation: any

agent_facing_message: >
  Circular dependencies detected. Break the cycle by:
  1. Extracting shared logic to a third module that both depend on
  2. Moving one of the dependencies to a lower layer (dependency inversion)
  3. Using interfaces/abstract types instead of concrete imports
  Cycles make the codebase harder to understand and test.

research_tags:
  drift_type: entanglement
  pattern: cyclic-coupling
