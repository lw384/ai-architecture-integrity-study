rule_id: BE-DEP-C-002-infrastructure-isolation
version: 0.2.0
tier: 1
layer: constraints
category: dependency-architecture
visibility: agent-visible

description: >
  Infrastructure layers (common, core) must remain independent of business modules.
  Common utilities and core infrastructure (database, seed, config) should not depend
  on specific module implementations to avoid circular dependencies and coupling.
  Violations:
  - imports from src/modules/** into src/common/**
  - imports from src/modules/** into src/core/**

evidence_sources:
  - adapter: backend-static
    tool_rule_ids:
      - BE-DEP-C-002
    match_condition:
      event_type: backend_architecture_violation
    aggregation: any

agent_facing_message: "{message}"

research_tags:
  drift_type: erosion
  layer_violation: infrastructure
