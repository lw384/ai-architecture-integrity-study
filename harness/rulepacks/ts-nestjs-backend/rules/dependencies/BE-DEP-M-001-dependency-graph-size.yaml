rule_id: BE-DEP-M-001-dependency-graph-size
version: 0.1.0
layer: metrics
category: architecture
visibility: agent-visible
severity: warn
adapter: computed-metrics
implementation: dependency-graph

description: >
  Measures the total number of dependency edges in the analyzed backend graph.
  A larger graph usually indicates broader cross-module coupling.

agent_facing_message: >
  Dependency graph size reached {value} edges. Review whether new links are
  necessary or whether coupling can be reduced.

research_tags:
  metric_family: dependency-graph
  erosion_dimension: coupling-growth

methodological_note: >
  This experimental metric uses dep-cruiser JSON reports generated outside the
  adapter and compares target edge count against a baseline report.
