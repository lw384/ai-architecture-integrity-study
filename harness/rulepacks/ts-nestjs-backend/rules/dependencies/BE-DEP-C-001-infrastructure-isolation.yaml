rule_id: BE-DEP-C-001-infrastructure-isolation
version: 0.1.0
tier: 1
layer: constraints
category: dependency-architecture
visibility: agent-visible
severity: error

description: >
  Infrastructure layers (common, core) must remain independent of business modules.
  Common utilities and core infrastructure (database, seed, config) should not depend
  on specific module implementations to avoid circular dependencies and coupling.
  Violations:
  - imports from src/modules/** into src/common/**
  - imports from src/modules/** into src/core/**

evidence_sources:
  - adapter: eslint
    tool_rule_ids:
      - "import/no-restricted-paths"
    match_condition:
      event_type: file_structure_violation
    aggregation: any

agent_facing_message: >
  Infrastructure utilities and core setup must not import from business modules.
  Keep common/ and core/ independent. Extract common patterns into these layers,
  or place module-specific setup inside the module itself.

research_tags:
  drift_type: erosion
  severity_class: hard_constraint
  layer_violation: infrastructure
