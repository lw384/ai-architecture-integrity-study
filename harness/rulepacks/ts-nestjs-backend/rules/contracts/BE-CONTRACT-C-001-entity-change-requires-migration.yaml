rule_id: BE-CONTRACT-C-001-entity-change-requires-migration
version: 0.2.0
tier: 1
layer: constraints
category: data-contract
visibility: agent-visible

description: >
  Decorated TypeORM column or relation changes must be accompanied by an executable
  migration whose up and down methods address the same table and column/relation.
  Empty or unrelated migration files do not satisfy the contract.

evidence_sources:
  - adapter: contract-diff
    tool_rule_ids:
      - "BE-CONTRACT-C-001-entity-change-requires-migration"
    match_condition:
      event_type: diff_contract_violation
    aggregation: any

agent_facing_message: "{message}"

research_tags:
  drift_type: erosion
  pattern: schema-without-migration
