rule_id: BE-CONTRACT-C-002-request-dto-uses-class-validator
version: 0.2.0
tier: 1
layer: constraints
category: data-contract
visibility: agent-visible

description: >
  DTOs used by @Body, @Query, @Param, or @Headers controller parameters must
  declare class-validator decorators. Mapped DTOs inherit their base validation,
  while newly declared fields are checked directly.

evidence_sources:
  - adapter: backend-static
    tool_rule_ids:
      - BE-CONTRACT-C-002
    match_condition:
      event_type: backend_architecture_violation
    aggregation: any

agent_facing_message: "{message}"

research_tags:
  drift_type: erosion
  pattern: unvalidated-request-dto
