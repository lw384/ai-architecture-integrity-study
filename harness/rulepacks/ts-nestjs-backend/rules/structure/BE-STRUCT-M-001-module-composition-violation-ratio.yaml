rule_id: BE-STRUCT-M-001-module-composition-violation-ratio
version: 0.1.0
layer: metrics
category: module-structure
visibility: agent-visible
severity: warn
adapter: computed-metrics
implementation: BE-STRUCT-M-001

description: >
  Measures continuous drift for module composition completeness.
  Violating module ratio = modules missing any required component
  (controller/service) divided by total modules in scope.
  Repository remains optional to stay consistent with C-001.

  Formula: violating_modules / total_modules
  CHINESE: 违规 module 占比 = 缺失 controller/service 的 module 数 / 总 module 数
  （repository 可选，与 C-001 保持一致）

agent_facing_message: >
  Module composition violation ratio is {value}. Reduce modules missing required
  files (controller/service) to control structural erosion. Repository is
  optional under the current policy.

research_tags:
  metric_family: module-composition
  erosion_dimension: missing-components-ratio

methodological_note: >
  This metric should reuse the same module-composition criteria as
  BE-STRUCT-C-001-module-composition and compare target ratio against baseline
  via delta_vs_baseline.
