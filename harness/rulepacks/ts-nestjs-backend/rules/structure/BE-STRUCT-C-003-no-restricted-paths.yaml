rule_id: BE-STRUCT-C-003-no-restricted-paths
version: 0.1.0
layer: constraints
category: architecture
visibility: agent-visible
severity: error

description: >
  NestJS layers must not cross restricted path boundaries declared by the
  rulepack ESLint configuration.

evidence_sources:
  - adapter: eslint
    tool_rule_ids:
      - "import/no-restricted-paths"
    match_condition:
      event_type: file_structure_violation
    aggregation: any

agent_facing_message: >
  This import crosses a restricted path boundary. Move the dependency behind
  the allowed layer boundary.

research_tags:
  drift_type: erosion
  severity_class: hard_constraint
