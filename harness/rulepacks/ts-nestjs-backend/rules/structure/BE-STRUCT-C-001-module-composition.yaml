rule_id: BE-STRUCT-C-001-module-composition
version: 0.2.0
tier: 1
layer: constraints
category: module-structure
visibility: agent-visible

description: >
  Each business module under src/modules/<resource>/ must provide separate
  module, controller, service, and repository files and register the controller,
  service, and repository in @Module metadata. Root application modules are excluded.

evidence_sources:
  - adapter: backend-static
    tool_rule_ids:
      - BE-STRUCT-C-001
    match_condition:
      event_type: backend_architecture_violation
    aggregation: any

agent_facing_message: "{message}"

research_tags:
  drift_type: erosion
  pattern: missing-components
