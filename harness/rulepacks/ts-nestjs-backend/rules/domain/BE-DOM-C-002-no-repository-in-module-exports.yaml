rule_id: BE-DOM-C-002-no-repository-in-module-exports
version: 0.3.0
tier: 1
layer: constraints
category: module-boundary
visibility: agent-visible

description: >
  Module entry files must not expose persistence-layer details.
  Entry files (*.module.ts / index.ts) must not re-export repository or entity
  implementations to other modules.

evidence_sources:
  - adapter: backend-static
    tool_rule_ids:
      - BE-DOM-C-002
    match_condition:
      event_type: backend_architecture_violation
    aggregation: any

agent_facing_message: "{message}"

research_tags:
  drift_type: erosion
  pattern: persistence-leakage
