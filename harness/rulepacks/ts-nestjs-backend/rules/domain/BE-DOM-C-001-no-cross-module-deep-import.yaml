rule_id: BE-DOM-C-001-no-cross-module-deep-import
version: 0.1.0
tier: 1
layer: constraints
category: module-boundary
visibility: agent-visible
severity: error

description: >
  Cross-module imports must go through module entry files only.
  A module may import another module only via *.module.ts or index.ts.
  Deep imports into internal implementation files (controller/service/
  repository/entity/dto) are forbidden across module boundaries.

evidence_sources:
  - adapter: dep-cruiser
    tool_rule_ids:
      - "BE-DOM-C-001-no-cross-module-deep-import"
    match_condition:
      event_type: dependency_edge_violation
    aggregation: any

agent_facing_message: >
  Cross-module deep import detected. Import from the target module entry file
  (*.module.ts or index.ts) instead of internal implementation files.

research_tags:
  drift_type: erosion
  severity_class: hard_constraint
  pattern: boundary-bypass
