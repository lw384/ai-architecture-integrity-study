rule_id: BE-SIZE-M-001-method-parameter-violation-ratio
version: 0.1.0
layer: metrics
category: size-complexity
visibility: agent-visible
severity: warn
adapter: computed-metrics
implementation: method-parameter-violation-ratio

description: >
  Measures the share of production methods exceeding the parameter limit.
  Value = methods with more than three direct parameters / all production methods.

agent_facing_message: >
  Wide-signature method ratio is {value}. Reduce direct parameters in production methods.

research_tags:
  metric_family: method-signature-width
  erosion_dimension: interface-complexity
