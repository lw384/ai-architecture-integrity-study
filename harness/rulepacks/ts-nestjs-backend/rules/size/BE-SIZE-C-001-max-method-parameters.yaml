rule_id: BE-SIZE-C-001-max-method-parameters
version: 0.2.0
tier: 1
layer: constraints
category: size-complexity
visibility: agent-visible

description: >
  Production controller, service, and repository methods must not exceed three
  direct parameters. Constructors and test files are excluded.

evidence_sources:
  - adapter: backend-static
    tool_rule_ids:
      - BE-SIZE-C-001
    match_condition:
      event_type: backend_architecture_violation
    aggregation: any

agent_facing_message: "{message}"

research_tags:
  drift_type: erosion
  pattern: wide-method-signature
