rulepack_id: ts-nestjs-backend
version: 0.1.0
kind: subject
language: [typescript]
frameworks: [nestjs]

adapters:
  dep-cruiser:
    source: dep-cruiser
    version: 0.1.0
    config: tool-configs/dep-cruiser.config.cjs
    emits: [constraints]
  eslint:
    source: eslint
    version: 0.1.0
    config: tool-configs/eslint.config.js
    emits: [constraints]
  contract-diff:
    source: contract-diff
    version: 0.1.0
    config: tool-configs/contract-diff.config.json
    emits: [constraints]
  computed-metrics:
    source: computed-metrics
    version: 0.1.0
    config: tool-configs/metrics.config.json
    emits: [metrics]
  test-coverage:
    source: test-coverage
    version: 0.1.0
    config: tool-configs/metrics.config.json
    emits: [metrics]

rules:
  constraints:
    - rules/structure/BE-STRUCT-C-001-module-composition.yaml
    - rules/dependencies/BE-DEP-C-001-intra-module-layering.yaml
    - rules/dependencies/BE-DEP-C-002-infrastructure-isolation.yaml
    - rules/dependencies/BE-DEP-C-003-framework-layer-purity.yaml
    - rules/dependencies/BE-DEP-C-004-no-circular-dependencies.yaml
    - rules/domain/BE-DOM-C-001-no-cross-module-deep-import.yaml
    - rules/domain/BE-DOM-C-002-no-repository-in-module-exports.yaml
    - rules/error/BE-ERR-C-001-no-http-exception-in-service.yaml
    - rules/error/BE-ERR-C-002-throw-only-app-exception.yaml
    - rules/error/BE-ERR-C-003-no-silent-catch.yaml
    - rules/contracts/BE-CONTRACT-C-001-entity-change-requires-migration.yaml
    - rules/contracts/BE-CONTRACT-C-002-request-dto-uses-class-validator.yaml
    - rules/test/BE-TEST-C-001-no-direct-repository-construction.yaml
    - rules/routes/BE-ROUTE-C-001-api-prefix-and-kebab-case.yaml
    - rules/size/BE-SIZE-C-001-max-method-parameters.yaml
  metrics:
    - rules/structure/BE-STRUCT-M-001-module-composition-violation-ratio.yaml
    - rules/dependencies/BE-DEP-M-001-dependency-violation-density.yaml
    - rules/domain/BE-DOM-M-001-cross-module-deep-import-count.yaml
    - rules/error/BE-ERR-M-001-exception-unification-violation-density.yaml
    - rules/contracts/BE-CONTRACT-M-001-dto-validator-coverage.yaml
    - rules/test/BE-TEST-M-001-test-coverage.yaml
    - rules/test/BE-TEST-M-002-mock-per-test-case.yaml
    - rules/routes/BE-ROUTE-M-001-route-prefix-violation-ratio.yaml
    - rules/size/BE-SIZE-M-001-method-parameter-violation-ratio.yaml
  judgments: []

metadata:
  migration_status: minimal-schema-valid
  notes:
    - Uses only rule and configs that currently exist on disk.
    - Metrics are currently experimental and only wired through computed-metrics.
