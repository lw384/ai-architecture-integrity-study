rule_id: ARCH-001-layer-boundary
version: 0.1.0
tier: 1
layer: constraints
category: architecture
visibility: agent-visible
severity: error

description: >
  Controller 层不得直接依赖 Repository 或 Entity 层。
  所有对数据的访问必须经过 Service 层。

evidence_sources:
  - adapter: dep-cruiser
    tool_rule_ids:
      - ARCH-001-controller-to-repo
      - ARCH-001-controller-to-entity
    match_condition:
      event_type: dependency_edge_violation
    aggregation: any

agent_facing_message: >
  Architecture violation: {from_module} in the controller layer
  directly accesses {to_module} in the data layer.
  Route this through a service method instead.

research_tags:
  drift_type: erosion
  severity_class: hard_constraint
  erosion_dimension: layer_direction
  Perry_Wolf_class: explicit_rule_violation

methodological_note: >
  This rule operationalizes the layered architecture pattern. Detection is via
  dep-cruiser static analysis on ES module imports. Type-only imports are treated
  as dependencies because they encode architectural intent in the evaluated baseline.

sanity_test_cases:
  should_flag:
    - fixture: fixtures/tier-1/ARCH-001-controller-to-repo
      expected_finding_count: 1
  should_not_flag:
    - fixture: fixtures/baseline-clean

related_rules:
  - ARCH-005-upward-import

references:
  - source: "Perry & Wolf (1992)"
    context: "distinction between erosion and drift"